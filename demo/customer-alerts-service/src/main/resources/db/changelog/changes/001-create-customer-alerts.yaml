databaseChangeLog:
  - changeSet:
      id: 001-create-customer-alerts
      author: student
      changes:
        - createTable:
            tableName: customer_alerts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: source_event_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: repair_order_id
                  type: BIGINT
              - column:
                  name: event_type
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: customer_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
